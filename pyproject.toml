[tool.poetry]
name = "ghostshell"
version = "0.1.0"
description = "A Digital Twin content engine for LinkedIn creators"
authors = []
packages = [{include = "ghostshell"}]

[tool.poetry.dependencies]
python = "^3.9"
typer = "^0.9.0"
rich = "^13.7.0"
google-genai = "^1.0.0"
python-frontmatter = "^1.0.1"
pydantic = "^2.5.3"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.1"
inquirerpy = "^0.3.4"

[tool.poetry.scripts]
ghostshell = "ghostshell.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
